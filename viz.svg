<text x="56.0" y="416.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">True. In the failing fixture the frontier stalls at 3 (the 0) while the end sits at</text>
<text x="56.0" y="435.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">4. No DP table needed — reachability on a line collapses to one running maximum.</text>
